apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "monitor-outbound-network-calls"
spec:
  kprobes:
    - call: "tcp_connect"
      syscall: false
      args:
        - index: 0
          type: "sock"
      selectors:
        - matchArgs:
            - index: 0
              operator: "DPort"
              values:
                - 80
                - 443
                - 8080
                - 3000
    - call: "sys_enter_connect"
      syscall: true
      args:
        - index: 0
          type: "int"
        - index: 1
          type: "sockaddr"
      selectors:
        - matchArgs:
            - index: 1
              operator: "DPort"
              values:
                - 80
                - 443
                - 8080
                - 3000
